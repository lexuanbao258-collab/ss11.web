services:
  postgres:
    image: postgres:16-alpine
    container_name: medical-postgres
    environment:
      POSTGRES_DB: medical_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - medical_postgres_data:/var/lib/postgresql/data

volumes:
  medical_postgres_data:
